name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  APPIMAGETOOL_VERSION: "12"
  BIN_NAME: openai-codex-proxy
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      release_ref: ${{ steps.release.outputs.release_ref }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_title: ${{ steps.release.outputs.release_title }}
      asset_version: ${{ steps.release.outputs.asset_version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve release source
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          package_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "${package_version}" ]]; then
            echo "Could not resolve package version from Cargo.toml" >&2
            exit 1
          fi

          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            release_ref="${WORKFLOW_HEAD_SHA}"
            short_sha="${WORKFLOW_HEAD_SHA:0:12}"
            release_tag="main-${WORKFLOW_RUN_NUMBER}-${WORKFLOW_RUN_ATTEMPT}-${short_sha}"
            release_title="Main build ${short_sha}"
            asset_version="${package_version}-main.${WORKFLOW_RUN_NUMBER}.${WORKFLOW_RUN_ATTEMPT}"
            prerelease="true"
          else
            release_tag="${DISPATCH_TAG:-${REF_NAME}}"
            release_ref="${release_tag}"
            release_title="${release_tag}"
            asset_version="${release_tag#v}"
            prerelease="false"
          fi

          {
            echo "release_ref=${release_ref}"
            echo "release_tag=${release_tag}"
            echo "release_title=${release_title}"
            echo "asset_version=${asset_version}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

      - name: Create automatic main tag
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          RELEASE_REF: ${{ steps.release.outputs.release_ref }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists; reusing it."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" "${RELEASE_REF}" -m "Automated main release ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"

  validate:
    name: Validate release source
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy

      - name: Cache cargo state
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-validate-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            release-validate-cargo-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  build:
    name: Build ${{ matrix.label }}
    needs:
      - prepare
      - validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_suffix: linux-x64
            archive: tar.gz
            appimage_arch: x86_64
          - label: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_suffix: linux-arm64
            archive: tar.gz
            appimage_arch: aarch64
          - label: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            asset_suffix: macos-x64
            archive: tar.gz
            appimage_arch: ""
          - label: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            asset_suffix: macos-arm64
            archive: tar.gz
            appimage_arch: ""
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_suffix: windows-x64
            archive: zip
            appimage_arch: ""
          - label: Windows ARM64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset_suffix: windows-arm64
            archive: zip
            appimage_arch: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Cache cargo state
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            release-${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        env:
          CODEX_PROXY_BUILD_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        id: package-unix
        shell: bash
        env:
          ASSET_VERSION: ${{ needs.prepare.outputs.asset_version }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          asset="${BIN_NAME}-${ASSET_VERSION}-${ASSET_SUFFIX}"
          archive="${asset}.tar.gz"
          mkdir -p "dist/${asset}"
          cp "target/${TARGET}/release/${BIN_NAME}" "dist/${asset}/"
          cp README.md LICENSE "dist/${asset}/"
          tar -C dist -czf "dist/${archive}" "${asset}"
          echo "archive=dist/${archive}" >> "${GITHUB_OUTPUT}"

      - name: Package Linux AppImage
        if: matrix.appimage_arch != ''
        id: package-appimage
        shell: bash
        env:
          APPIMAGE_ARCH: ${{ matrix.appimage_arch }}
          ASSET_VERSION: ${{ needs.prepare.outputs.asset_version }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          asset="${BIN_NAME}-${ASSET_VERSION}-${ASSET_SUFFIX}"
          appdir="dist/${asset}.AppDir"
          appimage="dist/${asset}.AppImage"
          appimagetool="dist/appimagetool-${APPIMAGE_ARCH}.AppImage"

          mkdir -p \
            "${appdir}/usr/bin" \
            "${appdir}/usr/share/applications" \
            "${appdir}/usr/share/doc/${BIN_NAME}" \
            "${appdir}/usr/share/icons/hicolor"

          cp "target/${TARGET}/release/${BIN_NAME}" "${appdir}/usr/bin/${BIN_NAME}"
          cp README.md LICENSE "${appdir}/usr/share/doc/${BIN_NAME}/"

          cat > "${appdir}/AppRun" <<'APP_RUN'
          #!/usr/bin/env sh
          set -eu
          appdir="$(dirname "$(readlink -f "$0")")"
          if [ "$#" -eq 0 ]; then
            exec "${appdir}/usr/bin/openai-codex-proxy" tray
          fi
          exec "${appdir}/usr/bin/openai-codex-proxy" "$@"
          APP_RUN
          chmod +x "${appdir}/AppRun"

          cat > "${appdir}/${BIN_NAME}.desktop" <<DESKTOP_ENTRY
          [Desktop Entry]
          Type=Application
          Name=OpenAI Codex Proxy
          Comment=Local OpenAI-compatible proxy for the ChatGPT/Codex backend
          Exec=${BIN_NAME} tray
          Icon=${BIN_NAME}
          Categories=Development;Network;
          Terminal=false
          DESKTOP_ENTRY
          cp "${appdir}/${BIN_NAME}.desktop" "${appdir}/usr/share/applications/${BIN_NAME}.desktop"
          cp "assets/icons/hicolor/256x256/apps/${BIN_NAME}.png" "${appdir}/${BIN_NAME}.png"
          cp -R assets/icons/hicolor/* "${appdir}/usr/share/icons/hicolor/"

          curl -fsSL \
            -o "${appimagetool}" \
            "https://github.com/AppImage/AppImageKit/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-${APPIMAGE_ARCH}.AppImage"
          chmod +x "${appimagetool}"

          ARCH="${APPIMAGE_ARCH}" APPIMAGE_EXTRACT_AND_RUN=1 "${appimagetool}" "${appdir}" "${appimage}"

          echo "appimage=${appimage}" >> "${GITHUB_OUTPUT}"

      - name: Package Windows archive
        if: matrix.archive == 'zip'
        id: package-windows
        shell: pwsh
        env:
          ASSET_VERSION: ${{ needs.prepare.outputs.asset_version }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
          TARGET: ${{ matrix.target }}
        run: |
          $asset = "${env:BIN_NAME}-${env:ASSET_VERSION}-${env:ASSET_SUFFIX}"
          $archive = "${asset}.zip"
          New-Item -ItemType Directory -Force -Path "dist/${asset}" | Out-Null
          Copy-Item "target/${env:TARGET}/release/${env:BIN_NAME}.exe" "dist/${asset}/"
          Copy-Item README.md, LICENSE "dist/${asset}/"
          Compress-Archive -Path "dist/${asset}" -DestinationPath "dist/${archive}" -Force
          "archive=dist/${archive}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Generate build provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.package-unix.outputs.archive || steps.package-windows.outputs.archive }}

      - name: Generate AppImage provenance attestation
        if: matrix.appimage_arch != ''
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.package-appimage.outputs.appimage }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ steps.package-unix.outputs.archive || steps.package-windows.outputs.archive }}
            ${{ steps.package-appimage.outputs.appimage }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}

      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate combined checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.AppImage' \) -print0 \
            | sort -z \
            | xargs -0 shasum -a 256 > SHA256SUMS

      - name: Generate checksum provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: release-assets/SHA256SUMS

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_TITLE: ${{ needs.prepare.outputs.release_title }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --title "${RELEASE_TITLE}"
            gh release upload "${RELEASE_TAG}" release-assets/* --clobber
          else
            release_args=(
              --verify-tag
              --title "${RELEASE_TITLE}"
              --generate-notes
            )
            if [[ "${PRERELEASE}" == "true" ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "${RELEASE_TAG}" release-assets/* "${release_args[@]}"
          fi
