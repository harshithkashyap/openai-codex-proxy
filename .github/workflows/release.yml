name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  BIN_NAME: openai-codex-proxy
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy

      - name: Cache cargo state
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-validate-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            release-validate-cargo-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  build:
    name: Build ${{ matrix.label }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - label: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - label: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - label: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - label: Windows ARM64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Cache cargo state
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            release-${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        id: package-unix
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          asset="${BIN_NAME}-${RELEASE_TAG}-${TARGET}"
          archive="${asset}.tar.gz"
          mkdir -p "dist/${asset}"
          cp "target/${TARGET}/release/${BIN_NAME}" "dist/${asset}/"
          cp README.md LICENSE "dist/${asset}/"
          tar -C dist -czf "dist/${archive}" "${asset}"
          (cd dist && shasum -a 256 "${archive}" > "${archive}.sha256")
          echo "archive=dist/${archive}" >> "${GITHUB_OUTPUT}"
          echo "checksum=dist/${archive}.sha256" >> "${GITHUB_OUTPUT}"

      - name: Package Windows archive
        if: matrix.archive == 'zip'
        id: package-windows
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $asset = "${env:BIN_NAME}-${env:RELEASE_TAG}-${env:TARGET}"
          $archive = "${asset}.zip"
          New-Item -ItemType Directory -Force -Path "dist/${asset}" | Out-Null
          Copy-Item "target/${env:TARGET}/release/${env:BIN_NAME}.exe" "dist/${asset}/"
          Copy-Item README.md, LICENSE "dist/${asset}/"
          Compress-Archive -Path "dist/${asset}" -DestinationPath "dist/${archive}" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "dist/${archive}").Hash.ToLowerInvariant()
          "${hash}  ${archive}" | Out-File -FilePath "dist/${archive}.sha256" -Encoding ascii
          "archive=dist/${archive}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "checksum=dist/${archive}.sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Generate build provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.package-unix.outputs.archive || steps.package-windows.outputs.archive }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ steps.package-unix.outputs.archive || steps.package-windows.outputs.archive }}
            ${{ steps.package-unix.outputs.checksum || steps.package-windows.outputs.checksum }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate combined checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 \
            | sort -z \
            | xargs -0 shasum -a 256 > SHA256SUMS

      - name: Generate checksum provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: release-assets/SHA256SUMS

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release-assets/* --clobber
          else
            gh release create "${RELEASE_TAG}" release-assets/* \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --generate-notes
          fi
